<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem('zad_'+k))??d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem('zad_'+k,JSON.stringify(v))}catch(e){}};
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

let ST=Object.assign({theme:'auto',fs:30,rec:'ar.alafasy',method:5,loc:null},ld('set',{}));const save=()=>sv('set',ST);
function theme(){const dk=ST.theme=='dark'||(ST.theme=='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dk?'dark':'light'}
function toast(m){let t=$('#ts');if(!t){t=document.createElement('div');t.id='ts';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,3000)}

async function api(p){const r=await fetch('https://api.alquran.cloud/v1/'+p);if(!r.ok)throw new Error(r.status);return(await r.json()).data}

const TR=[['p','الصلوات الخمس','🕌'],['m','أذكار الصباح','🌅'],['e','أذكار المساء','🌙'],['q','قراءة القرآن','📖'],['s','التسبيح','📿'],['g','أعمال الخير','🤲']];

const f12=t=>new Date(t).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'});
function nextP(){if(!PT||!PT.days)return null;const now=Date.now();for(const dy of PT.days)for(const[k,n]of PN){if(k=='Sunrise')continue;const t=tm(dy.date,dy.t[k]);if(t>now)return{k,n,t}}return null}
async function loadPT(){const L=ST.loc;if(!L)return;const prev=PT;PT=prev?{...prev,loading:true}:{loading:true};draw();
 const ds=[new Date(),new Date(Date.now()+864e5)],f=d=>`${String(d.getDate()).padStart(2,'0')}-${String(d.getMonth()+1).padStart(2,'0')}-${d.getFullYear()}`;
 const u=d=>'https://api.aladhan.com/v1/'+(L.city?`timingsByCity/${f(d)}?city=${encodeURIComponent(L.city)}&country=${encodeURIComponent(L.country)}&method=${ST.method}`:`timings/${f(d)}?latitude=${L.lat}&longitude=${L.lon}&method=${ST.method}`);
 try{const r=await Promise.all(ds.map(d=>fetch(u(d)).then(x=>{if(!x.ok)throw 0;return x.json()})));
  PT={at:Date.now(),lat:r[0].data.meta.latitude,lon:r[0].data.meta.longitude,days:r.map((x,i)=>({date:key(ds[i]),t:x.data.timings,h:x.data.date.hijri}))};sv('pt',PT)}
 catch(e){PT=prev?{...prev,stale:true}:{err:true}}draw()}
const hj=()=>{const d=PT&&PT.days&&PT.days.find(x=>x.date==key());return d?`${AR(d.h.day)} ${d.h.month.ar} ${AR(d.h.year)} هـ`:new Date().toLocaleDateString('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'})};

const AD=[
{id:1,c:'sab mas sal nom',q:'a262',n:1,s:'آية الكرسي — البقرة ٢٥٥'},

{id:4,c:'sab mas nom',q:'s114',n:3,s:'الناس — أبو داود والترمذي، وعند النوم: البخاري'},
{id:5,c:'sab mas',t:'اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَى عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ',n:1,s:'سيد الاستغفار — البخاري'},
{id:6,c:'sab',t:'اللَّهُمَّ بِكَ أَصْبَحْنَا، وَبِكَ أَمْسَيْنَا، وَبِكَ نَحْيَا، وَبِكَ نَمُوتُ، وَإِلَيْكَ النُّشُورُ',n:1,s:'الترمذي'},

{id:10,c:'sab mas',t:'سُبْحَانَ اللَّهِ وَبِحَمْدِهِ',n:100,s:'مسلم'},

{id:12,c:'sal',t:'اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ',n:1,s:'مسلم'},

{id:19,c:'ist',t:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',n:1,s:'البخاري'},

{id:22,c:'dua',q:'a208',n:1,s:'البقرة ٢٠١'},
{id:23,c:'dua',t:'اللَّهُمَّ إِنِّي أَسْأَلُكَ الْهُدَى وَالتُّقَى وَالْعَفَافَ وَالْغِنَى',n:1,s:'مسلم'},
{id:24,c:'dua',t:'اللَّهُمَّ أَعِنِّي عَلَى ذِكْرِكَ وَشُكْرِكَ وَحُسْنِ عِبَادَتِكَ',n:1,s:'أبو داود والنسائي'},

 geo:()=>{if(!navigator.geolocation)return toast('المتصفح لا يدعم تحديد الموقع');navigator.geolocation.getCurrentPosition(p=>{ST.method=+$('#me').value;ST.loc={lat:p.coords.latitude,lon:p.coords.longitude};save();$('#dlg').close();loadPT()},()=>toast('لم يتم السماح بالموقع. أدخل مدينتك يدويًا.'))},
 compass:async()=>{try{if(DeviceOrientationEvent.requestPermission&&await DeviceOrientationEvent.requestPermission()!='granted')return}catch(e){}const h=e=>{const hd=e.webkitCompassHeading??(e.absolute&&e.alpha!=null?360-e.alpha:null);if(hd==null||isNaN(hd))return;const el=$('#qa');if(el)el.style.transform=`rotate(${QB-hd}deg)`};addEventListener('deviceorientationabsolute',h,true);addEventListener('deviceorientation',h,true);toast('حرّك الهاتف ليتحدد الاتجاه')}};
const C={rec:async v=>{ST.rec=v;save();const a=RS.ay[CUR-1],was=!AU.paused;AU.pause();await openS(RS.n,CUR||0);if(was&&CUR)playA(CUR)},dh:v=>{const t=ld('tsb',{cur:v,cnt:0,tot:{}});t.cur=v;t.cnt=0;sv('tsb',t);draw()},th:v=>{ST.theme=v;save();theme()}};
const I={sf:v=>{SF=v.trim();const L=(SU||[]).filter(s=>!SF||norm(s.name).includes(norm(SF))||s.englishName.toLowerCase().includes(SF.toLowerCase())||String(s.number)==SF);$('#sl').innerHTML=slist(L)},vol:v=>{AU.volume=+v;sv('vol',+v)}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){e.preventDefault();A[b.dataset.a](b.dataset,b)}});
document.addEventListener('change',e=>{const b=e.target.closest('[data-c]');if(b&&C[b.dataset.c])C[b.dataset.c](b.value,b)});
document.addEventListener('input',e=>{const b=e.target.closest('[data-i]');if(b&&I[b.dataset.i])I[b.dataset.i](b.value,b)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.dataset.k=='vs')A.vsearch()});
theme();matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
draw();if(ST.loc)loadPT();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
